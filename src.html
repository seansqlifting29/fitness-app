<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fitness Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Seg7;src:url(data:font/woff2;base64,__FONT7__) format('woff2');font-weight:700}
:root{
  --bg:#121212; --card:#1a1a19; --card2:#242423; --line:#2a2a28;
  --t1:#f0efec; --t2:#c3c2b7; --t3:#8a8980;
  --lift:#199e70; --rest:#d95926; --other:#3987e5; --over:#e66767;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;font-family:Inter,system-ui,sans-serif;color:var(--t1);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){body{display:flex;align-items:center;justify-content:center;padding:24px}#app{height:min(860px,calc(100vh - 48px));width:390px;border-radius:32px;border:8px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #2a2a2a}}
.main{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;flex:none}
.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.hdr .sub{font-size:14px;color:var(--t3);margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--t2);fill:none;stroke-width:2}

/* ---------- calm list ---------- */
.home{flex:1;display:flex;flex-direction:column;padding:6px 20px 20px}
.livepill{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;margin:6px 0 4px;font-size:14px;color:var(--t2);width:100%;text-align:left}
.livepill .dot{width:9px;height:9px;border-radius:50%;background:var(--t3)}
.livepill.saved .dot{background:var(--lift)}
.livepill.lift .dot{background:var(--lift)}.livepill.rest .dot{background:var(--rest)}.livepill.over .dot{background:var(--over)}
.livepill b{color:var(--t1);margin-left:auto;font-weight:700}
.items{margin-top:14px}
.item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px 4px;border-bottom:1px solid var(--line)}
.item:first-child{border-top:1px solid var(--line)}
.circ{width:28px;height:28px;border-radius:50%;border:2px solid #5a5a55;flex:none;display:grid;place-items:center;transition:all .15s}
.circ svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0}
.item.done .circ{background:var(--lift);border-color:var(--lift)}
.item.done .circ svg{opacity:1}
.item .t{flex:1;font-size:19px;font-weight:600;letter-spacing:-.2px}
.item.done .t{color:var(--t3);text-decoration:line-through;text-decoration-thickness:1.5px}
.item .p{font-size:13px;color:var(--t3);font-weight:600}
.item.going .p{color:var(--t2)}
.chev{width:18px;height:18px;stroke:#55554f;fill:none;stroke-width:2.4;flex:none}
.addrow{color:var(--t3);font-size:15px;padding:18px 4px;text-align:left;width:100%}
.spacer{flex:1}
.finish{width:100%;height:56px;border-radius:16px;background:var(--card2);font-weight:700;font-size:17px;color:var(--t2);margin-top:16px}
.finish.ready{background:var(--t1);color:#111}
.restday{text-align:center;padding:60px 10px 10px}
.restday h2{font-size:24px;margin-bottom:8px}
.restday p{color:var(--t3);font-size:15px;margin-bottom:20px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card2);border-radius:20px;padding:10px 15px;font-weight:600;font-size:14px}

/* ---------- focus view ---------- */
.focus{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:8}
.focus.enter{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.ftop{flex:1;display:flex;flex-direction:column;padding:14px 20px 16px;min-height:0;overflow-y:auto;scrollbar-width:none}
.ftop::-webkit-scrollbar{display:none}
.fbar{display:flex;align-items:center;justify-content:space-between}
.back{display:flex;align-items:center;gap:2px;color:var(--t2);font-weight:600;font-size:15px;padding:6px 0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4}
.fname{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-top:10px}
.fset{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--t3);font-size:15px;font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#3a3a37}
.dots i.d{background:var(--lift)}.dots i.c{background:var(--t1)}
.inputs{display:flex;gap:10px;margin-top:auto}
.stepper{flex:1;background:var(--card);border-radius:20px;padding:12px 10px 10px;text-align:center}
.stepper label{font-size:12px;color:var(--t3);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.stepper input{display:block;width:100%;background:none;border:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1.5px;outline:none;margin:2px 0 6px;padding:0}
.stepper .pm{display:flex;gap:8px}
.stepper .pm button{flex:1;height:44px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:600;color:var(--t2)}
.stepper .pm button:active{background:#33332f}
.inputs .stepper{transition:opacity .3s ease}
.inputs.off .stepper{opacity:.35}
.itag.live{color:#f08d63}
.focus.shortT .timer{height:auto;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.focus.shortT .tclock{font-size:min(14vw,58px);margin:8px 0 0}
.focus.shortT .tsub{margin-top:6px}
.focus.shortT .tbtn{margin-top:14px;height:54px}
.focus.shortT .itag{margin-top:8px}
.picks{min-height:100px}
.itag{margin-top:auto;min-height:18px;font-size:12.5px;font-weight:600;color:var(--t3);text-align:center;margin-bottom:6px}
.itag b{color:var(--t2)}
.itag+.inputs{margin-top:0}
.inputs.compact{margin-top:10px}
.inputs.compact .stepper{padding:7px 8px 8px}
.inputs.compact .stepper input{font-size:30px;margin:0 0 4px}
.inputs.compact .stepper .pm button{height:34px;font-size:20px}
.inputs.compact+.fnote{margin-top:6px}
.pick{padding:11px 14px}
.inputs.live .stepper{box-shadow:inset 0 0 0 1.5px #f08d63}
.inputs.off .stepper button{cursor:default}
.logwrap{margin-top:auto}
.loghead{font-size:12.5px;font-weight:700;color:#f08d63;letter-spacing:.8px;text-transform:uppercase;margin:0 2px 8px}
.logwrap .inputs{margin-top:0}
.inputs.ro .stepper{padding:14px 10px 16px;border:1px solid var(--line)}
.inputs.ro .stepper b{display:block;font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-top:4px}
.fixhint{font-size:12px;color:var(--t3);margin:6px 2px 0}
.fnote b{color:var(--t2);font-weight:700}
.fnote{font-size:13px;color:var(--t3);text-align:center;margin-top:10px;min-height:18px}
.fnote button{color:var(--t2);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.exdone{display:flex;align-items:center;gap:6px;color:#5fd3a6;font-weight:700;font-size:15px;padding:4px 0}
.exdone .caret{font-size:11px;color:#3f9c78;margin-left:2px}
.ftop{overflow:hidden}
.shist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14.5px}
.sb i{font-style:normal;color:var(--t3);font-size:11.5px;font-weight:700;margin-right:7px}
.nextbox{margin-top:auto;display:flex;flex-direction:column;min-height:0;padding-top:12px}
.nextcard{display:flex;align-items:center;gap:10px;background:#1c2536;border:1.5px solid #4f7fc4;border-radius:16px;padding:15px 16px;text-align:left}
.nextcard .pn{flex:1;font-weight:700;font-size:17px}
.nextcard .chg{font-size:13.5px;font-weight:600;color:#8fb3ec}
.exdone svg{width:16px;height:16px;stroke:#5fd3a6;stroke-width:3;fill:none}
.alldone{margin-top:auto;background:var(--card);border-radius:18px;padding:16px;text-align:center}
.alldone b{display:block;font-size:17px;margin-bottom:4px}
.alldone span{font-size:14px;color:var(--t3)}
.dsum{font-size:13.5px;color:var(--t3);margin-top:6px;line-height:1.4}
.plbl{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin:16px 2px 8px}
.plbl span{letter-spacing:0;text-transform:none;font-weight:600;font-size:12.5px}
.picks{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1 1 auto}
.pick{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 14px;text-align:left;border:1.5px solid transparent}
.pick .rad{width:20px;height:20px;border-radius:50%;border:2px solid #5a5a55;flex:none}
.pick .pn{flex:1;font-weight:600;font-size:16px}
.pick .pp{font-size:12.5px;color:var(--t3);font-weight:600}
.pick.on{border-color:#4f7fc4;background:#1c2536}
.pick.on .rad{border:6px solid #6d9eea}
.donecard{margin-top:auto;background:var(--card);border-radius:20px;padding:18px;text-align:center}
.donecard b{display:block;font-size:20px;margin-bottom:4px}
.donecard span{color:var(--t3);font-size:14px}

.timer{height:calc(50% + env(safe-area-inset-bottom,0px));flex:none;background:#262624;display:flex;flex-direction:column;align-items:center;padding:18px 20px calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;transition:background .3s ease}
.timer.done{background:#1d5c4f}
.timer.lift{background:#1d6b4c}.timer.rest{background:#9a4a1f}.timer.over{background:#8f2a2a}.timer.next{background:#24406b}
.tl{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.7)}
.tclock{font-family:Seg7;font-weight:700;font-size:min(22vw,92px);line-height:1;margin:auto 0 0;letter-spacing:2px;color:#fff;white-space:nowrap}
.timer.idle .tclock{color:#6f6f6a}
.tsub{font-size:14px;color:rgba(255,255,255,.75);margin-top:10px;min-height:18px;text-align:center}
.tbtn{width:100%;height:60px;border-radius:18px;background:#fff;color:#111;font-size:19px;font-weight:800;margin-top:auto}
.tminis{display:flex;gap:18px;margin-top:12px;font-size:12px;color:rgba(255,255,255,.65)}
.tminis b{color:#fff;font-weight:700;margin-left:4px}

/* ---------- tabs ---------- */
.tabs{flex:none;height:calc(62px + env(safe-area-inset-bottom,0px));display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--t3)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.tabs button.on{color:var(--t1)}

/* ---------- plan ---------- */
.pad{padding:4px 14px 30px}
.day{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;width:100%;text-align:left}
.day .dn{width:44px;font-weight:800;font-size:15px}
.day .info{flex:1}
.day .sp{font-weight:700}
.day .ls{font-size:12.5px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.day.today{border-color:#5a5a55}
.tag{font-size:11px;font-weight:700;background:var(--t1);color:#111;border-radius:6px;padding:2px 6px}
.day.rest .sp{color:var(--t3)}
.edit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.edit .top{display:flex;gap:8px;align-items:center}
.edit input.n{flex:1;background:var(--card2);border:0;border-radius:10px;padding:10px;font-weight:700;outline:none;min-width:0}
.edit .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.edit label{font-size:10.5px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.edit .grid input{width:100%;background:var(--card2);border:0;border-radius:9px;padding:8px 4px;text-align:center;font-weight:700;margin-top:3px;outline:none}
.sm{width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--t2);font-weight:700;flex:none}
.field{width:100%;background:var(--card2);border:0;border-radius:12px;padding:12px;font-weight:700;font-size:17px;outline:none;margin-bottom:12px}
.lbl{font-size:12px;color:var(--t3);font-weight:600;margin:4px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.btn{background:var(--card2);border-radius:12px;padding:11px 16px;font-weight:700;color:var(--t1)}
.btn.w{background:var(--t1);color:#111}
.btn.red{color:var(--over)}
.addex{width:100%;padding:14px;border:1.5px dashed #3a3a37;border-radius:16px;color:var(--t2);font-weight:600;margin-top:4px}
.hdr .back{font-size:15px}

.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wday .wl{font-size:11px;color:var(--t3);font-weight:700}
.wday .wn{font-size:17px;font-weight:800}
.wday .ws{font-size:9.5px;font-weight:700;margin-top:4px;background:var(--card2);border-radius:7px;padding:2px 3px;letter-spacing:-.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wday.off .ws{background:none;color:var(--t3);font-weight:600}
.wday.today{border-color:var(--t1)}
.wday.today .wn{color:var(--t1)}
.wbubs{display:flex;flex-direction:column;gap:8px}
.wbub{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left}
.wbub b{font-size:18px;font-weight:800;letter-spacing:-.3px}
.wbub span{font-size:13px;color:var(--t3);margin-top:3px}
.wbub.new{border-style:dashed;background:none}
.wbub.new b{font-size:16px;color:var(--t2)}
.ptabs{margin-bottom:14px}
.focusrow{position:relative;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t3);margin-top:4px}
.dd{background:var(--card2);border-radius:14px;padding:6px 11px;font-size:13.5px;font-weight:700;color:var(--t1);display:inline-flex;align-items:center;gap:6px}
.dd .car{font-size:9px;color:var(--t3)}
.fmenu{position:absolute;left:42px;top:34px;background:#262624;border:1px solid #3a3a37;border-radius:14px;padding:6px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.5);width:220px}
.fmenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--t1)}
.fmenu button.on{background:#3a3a37}
.fmenu small{display:block;font-size:11.5px;color:var(--t3);font-weight:500;margin-top:1px}
.savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1e1e1d;border-top:1px solid var(--line);margin-top:auto}
.savebar span{flex:1;font-size:13.5px;color:var(--t2);font-weight:600}
.savebar .btn{padding:10px 14px}
.ba{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:13px;color:var(--t3)}.ba span{width:44px}.ba .mw{flex:1}
.week7 .wday{min-height:96px;padding:9px 1px 9px}
.week7 .wday .ws{margin-top:auto;display:flex;align-items:center;gap:3px;font-size:9.5px;padding:3px 4px}
.wdot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.pills2 .pill{display:inline-flex;align-items:center;gap:9px}
.pdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pill.rest{background:none;border:1.5px dashed #4a4a46;color:var(--t2)}
.week7 .wday,.pills2 .pill{touch-action:none;-webkit-user-select:none;user-select:none}
.dover{border-color:#4f7fc4!important;background:#1c2536!important}
.wday.dover{transform:scale(1.05)}
.dghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:.95;margin:0}
.ptrash{margin-top:10px;border:1.5px dashed #5a3a3a;border-radius:14px;padding:13px;text-align:center;color:var(--over);font-weight:600;font-size:13.5px;display:none}
.pad.dday .ptrash{display:block}
.tlist{display:flex;flex-direction:column;gap:8px}
.tcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:left;width:100%}
.tcard .tx{width:122px;flex:none}.tcard b{display:block;font-size:15.5px}.tcard .tx span{font-size:12.5px;color:var(--t3)}
.tcard .tw{flex:1;min-width:0}
.mw{display:flex;gap:3px}.mw i{flex:1;height:20px;border-radius:5px;background:#2a2a28;display:block}
.mwl{display:flex;gap:3px;margin-top:3px}.mwl em{flex:1;font-style:normal;font-size:8.5px;color:var(--t3);text-align:center}
.pills2{display:flex;flex-wrap:wrap;gap:10px}
.pill{background:var(--card2);border-radius:26px;padding:14px 22px;font-size:17px;font-weight:700}
.pill.new{background:none;border:1.5px dashed #4a4a46;color:var(--t2)}
.phint{font-size:13px;color:var(--t3);margin:12px 4px}
.chip.on{background:var(--t1);color:#111}
.wname{width:100%;background:none;border:0;font-size:28px;font-weight:800;letter-spacing:-.6px;outline:none;padding:2px}
.wname:focus{background:var(--card2);border-radius:10px}
.prows{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 14px 12px;background:var(--card);border:1.5px solid transparent;border-radius:18px}
.prow>svg{color:var(--t3);flex:none}
.pnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:900;color:#0e0e0e;flex:none}
.prow .prn{flex:1;font-size:17px;font-weight:600;min-width:0}
.prow .prn small{display:block;font-size:13px;color:var(--t3);font-weight:500;margin-top:3px}
.prow.open{display:block;padding:14px 12px 12px;background:#262624;border-color:#3a3a37}
.prow.open .ptile{background:#171716;border-color:#2e2e2b}
.proh{display:flex;align-items:center;gap:12px}
.proh .prn{cursor:pointer}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ptile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px 12px;text-align:center}
.ptile small{display:block;font-size:11.5px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase}
.ptile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.ptile b i{font-style:normal;font-size:13px;color:var(--t3);margin-left:2px;font-weight:600}
.ptile:active{background:var(--card2)}
.pex{border-bottom:1px solid var(--line);padding:14px 2px}
.pex:first-of-type{border-top:1px solid var(--line)}
.pexh{display:flex;align-items:center;gap:6px}
.pexn{flex:1;font-size:17px;font-weight:600}
.pmini{width:30px;height:30px;border-radius:9px;color:var(--t3);font-size:14px;flex:none}
.pexc{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbub{background:var(--card2);border-radius:16px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--t3)}
.sbub.on{background:var(--t1);color:#111}
.sbub.wt{margin-left:auto;color:var(--t2)}

/* ===== storage ===== */

  {name:'Push',ex:[E('Incline Barbell Bench Press',3,10,55,90),E('Chest Press Machine',3,10,50,75),E('Pec Deck',3,12,35,60),E('Tricep Pushdown',3,12,25,60)]},

  {name:'Upper',ex:[E('Dumbbell Bench Press',3,10,26,90),E('Pull Up',3,8,0,90),E('Dumbbell Shoulder Press',3,10,20,75),E('Lateral Raise',3,15,8,45)]},
  {name:'Lower',ex:[E('Deadlift',3,5,100,150),E('Leg Press',3,12,120,90),E('Walking Lunge',3,12,16,60),E('Seated Leg Curl',3,12,35,60)]},
  {name:'Rest',ex:[]}

const oldUser=S.get('fit.user',null);
let me=S.get('gym.me',oldUser?{name:oldUser.name}:null);
function fromDays(days){const ws=[],wk=[];days.forEach(d=>{if(!d||!d.ex.length){wk.push(null);return}let w=ws.find(x=>x.name===d.name);if(!w){w={id:nid(),name:d.name,ex:d.ex.map(e=>({...e,id:nid()}))};ws.push(w)}wk.push(w.id)});return{ws,wk}}

if(!workouts||!week){const old=S.get('gym.plan',null);const m=fromDays(old||starterPlan());workouts=m.ws;week=old?m.wk:[null,null,null,null,null,null,null]}
const dayW=i=>workouts.find(w=>w.id===week[i])||null;

let ses=S.get('gym3.session',null);
if(!S.get('gym.weekReset1',false)){week=[null,null,null,null,null,null,null];if(ses&&!ses.startedAt)ses=null;S.set('gym.weekReset1',true);S.set('gym.week',week);S.set('gym3.session',ses)}
// clean up anything malformed in storage so a bad save can never brick the app
(function sanitize(){
  const okEx=e=>e&&typeof e.name==='string';
  if(!Array.isArray(workouts))workouts=[];
  workouts=workouts.filter(w=>w&&w.id&&typeof w.name==='string').map(w=>({...w,ex:Array.isArray(w.ex)?w.ex.filter(okEx).map(e=>({...e,id:e.id||nid(),sets:Math.min(20,Math.max(1,+e.sets||3)),reps:Math.max(0,+e.reps||0),w:Math.max(0,+e.w||0),rest:Math.min(900,Math.max(0,+e.rest||60))})):[]}));
  if(!Array.isArray(week)||week.length!==7)week=[null,null,null,null,null,null,null];
  week=week.map(id=>workouts.some(w=>w.id===id)?id:null);
  if(!Array.isArray(hist))hist=[];
  hist=hist.filter(h=>h&&h.date&&Array.isArray(h.ex));
  if(ses&&(typeof ses!=='object'||!Array.isArray(ses.ex)||!ses.date||ses.ex.some(e=>!okEx(e)||!Array.isArray(e.sets))))ses=null;
  if(ses){if(!['idle','lift','rest','next'].includes(ses.state))ses.state='idle';if(ses.active!==null&&!ses.ex[ses.active])ses.active=null;
    if(ses.lastSet&&!(ses.ex[ses.lastSet.e]&&ses.ex[ses.lastSet.e].sets[ses.lastSet.s]))ses.lastSet=null;
    ['tut','rest','stateAt'].forEach(k=>{if(!isFinite(ses[k]))ses[k]=k==='stateAt'?Date.now():0});if(typeof ses.split!=='string')ses.split=(workouts.find(w=>w.id===ses.wid)||{}).name||'Workout';
    if(ses.startedAt!=null&&(!isFinite(ses.startedAt)||ses.startedAt>Date.now()||Date.now()-ses.startedAt>3*86400000))ses.startedAt=ses.ex.some(e=>e.sets.some(x=>x.done))?Math.min(ses.stateAt,Date.now()):null;
    ses.ex.forEach(e=>e.sets=e.sets.filter(x=>x&&typeof x==='object').map(x=>({...x,w:Math.max(0,+x.w||0),r:Math.max(0,+x.r||0),tut:+x.tut||0})))}
})();
let cfg=Object.assign({unit:'kg',sound:true,restMode:'ratio',ratio:6},S.get('gym.cfg',{})||{});if(!['kg','lb'].includes(cfg.unit))cfg.unit='kg';if(!(cfg.ratio>=1&&cfg.ratio<=20))cfg.ratio=6;
const save=()=>{S.set('gym.me',me);S.set('gym.workouts',workouts);S.set('gym.week',week);S.set('gym.hist',hist);S.set('gym3.session',ses);S.set('gym.cfg',cfg)};

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wd=d=>(d.getDay()+6)%7;
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const clock=ms=>{ms=Math.max(0,ms);let s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const seg=ms=>{ms=Math.max(0,ms);let s=Math.floor(ms/1000);const m=Math.min(99,Math.floor(s/60));s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const mins=ms=>Math.round(ms/60000)+'m';
const U=()=>cfg.unit;
const num=v=>Math.round(v*10)/10;
let focusUI={more:false,nextOpen:false};
let planTab='custom';
let tab='today',planW=null,planOpen=undefined,openHist=null,range=S.get('gym.range',30),focus=null,nextPick=null;
function chosenNext(i){if(nextPick!==null&&nextPick!==i&&ses.ex[nextPick]&&!exDone(ses.ex[nextPick]))return nextPick;return nextUndone(i)}

const IC={
  today:'<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>'
};

/* ===== session (kept internal; the user only ever sees the current set) =====
 ses = {date, day, split, startedAt|null, state:'idle'|'lift'|'rest'|'next', stateAt, tut, rest,
        restTarget, active:exerciseIndex|null, ex:[{name,rest,prev,sets:[{w,r,done,tut}]}]} */
function lastFor(name){for(let i=hist.length-1;i>=0;i--){const x=hist[i].ex.find(e=>e.name===name);if(x)return x}return null}
function buildSession(wid,manual){
  const d=workouts.find(w=>w.id===wid)||{name:'Rest',ex:[]};
  return {date:dkey(new Date()),wid:wid||null,manual:!!manual,day:wd(new Date()),split:d.name,startedAt:null,state:'idle',stateAt:Date.now(),tut:0,rest:0,restTarget:0,active:null,
    ex:d.ex.map(e=>{const prev=lastFor(e.name);return{name:e.name,rest:e.rest,prev:prev?prev.sets.map(s=>num(s.w)+' × '+s.r).join(', '):'',
      sets:Array.from({length:e.sets},(_,i)=>{const p=prev&&prev.sets[i];return{w:p?p.w:e.w,r:p?p.r:e.reps,done:false,tut:0}})}})};
}
const plannedToday=()=>{const id=week[wd(new Date())];return workouts.some(w=>w.id===id)?id:null};
const IDLE_LIMIT=3*3600000;
function autoClose(){
  if(!ses||!ses.startedAt||ses.finished)return;
  const idle=Date.now()-ses.stateAt;const stale=idle>IDLE_LIMIT||(ses.date!==dkey(new Date())&&idle>3600000);if(!stale)return;

  if(ses.state==='rest')ses.rest+=Math.min(ses.restTarget||0,end-ses.stateAt);
  ses.state='idle';ses.active=null;
  const sets=ses.ex.flatMap(e=>e.sets.filter(x=>x.done));
  if(!sets.length){ses=null;return}
  hist.push({id:nid(),date:ses.date,start:ses.startedAt,split:ses.split,total:end-ses.startedAt,tut:ses.tut,rest:ses.rest,sets:sets.length,volume:Math.round(sets.reduce((a,x)=>a+x.w*x.r,0)),unit:U(),auto:true,
    ex:ses.ex.filter(e=>e.sets.some(x=>x.done)).map(e=>({name:e.name,sets:e.sets.filter(x=>x.done).map(x=>({w:x.w,r:x.r,tut:x.tut,rest:x.rest||null}))}))});
  ses.finished=true;ses.endedAt=end;focus=null;save();
}
function ensureSession(){autoClose();const p=plannedToday();
  if(!ses||(ses.date!==dkey(new Date())&&(!ses.startedAt||ses.finished))||(ses.date===dkey(new Date())&&!ses.startedAt&&!ses.manual&&ses.wid!==p)){ses=buildSession(p);save()}}
const doneCount=e=>e.sets.filter(s=>s.done).length;
const exDone=e=>e.sets.length>0&&doneCount(e)===e.sets.length;
const curIdx=e=>e.sets.findIndex(s=>!s.done);
const liveTut=()=>ses.tut+(ses.state==='lift'?Date.now()-ses.stateAt:0);
const liveRest=()=>ses.rest+(ses.state==='rest'?Date.now()-ses.stateAt:0);
function closeState(){const n=Date.now();if(ses.state==='lift')ses.tut+=n-ses.stateAt;if(ses.state==='rest')ses.rest+=n-ses.stateAt;ses.stateAt=n}
function nextUndone(after){const L=ses.ex.length;for(let k=1;k<=L;k++){const i=(after+k)%L;if(!exDone(ses.ex[i]))return i}return null}

function startSet(i){
  unlock();if(!ses.startedAt)ses.startedAt=Date.now();
  {const e=ses.ex[i];const j=e?curIdx(e):-1;if(j>0&&e.lastEnd&&e.sets[j]){const gap=Date.now()-e.lastEnd;e.sets[j].rest=gap<20*60000?gap:null}}
  closeState();ses.active=i;ses.state='lift';ses.stateAt=Date.now();ses.beeped=false;save();render();
}
function finishSet(i){
  const e=ses.ex[i];const j=curIdx(e);if(j<0)return;
  readInputs(i);
  const s=e.sets[j];s.tut=ses.state==='lift'&&ses.active===i?Date.now()-ses.stateAt:0;
  closeState();s.done=true;e.lastEnd=Date.now();if(!s.tut)s.rest=null;ses.active=i;ses.lastSet={e:i,s:j};ses.beeped=false;
  if(!exDone(e)){ses.state='rest';ses.restTarget=restFor(e,s);ses.restBy=cfg.restMode==='ratio'&&s.tut>=3000?{set:s.tut,ratio:cfg.ratio}:null}

  ses.stateAt=Date.now();save();render();

// rest target: work-to-rest ratio from how long the set took, or the exercise's custom time
function restFor(e,s){if(cfg.restMode==='ratio'&&s.tut>=3000)return Math.min(6*60000,Math.max(30000,Math.round(s.tut*cfg.ratio/1000)*1000));return e.rest*1000}
function lastSetLine(e,j){const prev=lastFor(e.name);if(!prev)return'First time';const p=prev.sets[j];
  return p?`Last time <b>${num(p.w)} × ${p.r}</b>`:''}
function undoLast(){if(focus!==null)readInputs(focus);
  const l=ses.lastSet;if(!l)return;const s=ses.ex[l.e].sets[l.s];s.done=false;s.tut=0;s.rest=null;
  closeState();ses.state='idle';ses.active=l.e;ses.lastSet=null;save();render();
}
function toggleExercise(i){ // grocery-style quick check from the list
  const e=ses.ex[i];
  if(exDone(e)){e.sets.forEach(s=>{s.done=false;s.tut=0});}
  else{if(!ses.startedAt)ses.startedAt=Date.now();e.sets.forEach(s=>s.done=true)}
  if(ses.active===i){closeState();ses.state='idle'}
  save();render();
}
// inputs only exist during rest, for the set you just finished
function readInputs(i){

/* ===== live tick ===== */
function phase(){
  // what the timer should show right now, from the user's point of view
  const now=Date.now();
  if(ses.state==='lift')return{k:'lift',label:'Lifting',ms:now-ses.stateAt};
  if(ses.state==='rest'){const left=ses.restTarget-(now-ses.stateAt);
    if(left>=0)return{k:'rest',label:'Rest',ms:left};return{k:'over',label:'Rest over',ms:-left,over:true}}
  if(ses.state==='next')return{k:'next',label:'Next station',ms:now-ses.stateAt};
  return{k:'idle',label:'Ready',ms:0};
}
function tick(){try{tickInner()}catch(e){console.error(e)}}
function tickInner(){
  if(!ses)return;
  if(!document.querySelector('.scrim')&&focus===null&&!document.querySelector('.dghost')){
    const newDay=ses.date!==dkey(new Date());const open=ses.startedAt&&!ses.finished;const idle=Date.now()-ses.stateAt;

    $('#pillC').textContent=clock(total)}
  const T=$('#ftimer');if(!T)return;

  else if(j<0){const nx=chosenNext(i);k=nx===null?'done':'next';label=nx===null?'Workout complete · gym time':'Next station';ms=nx===null?total:(mine&&ses.state==='next'?p.ms:0);
    sub=nx===null?'Every exercise is checked off':'Time since your last set';btn=nx===null?'Finish workout':'Next: '+ses.ex[nx].name;act=nx===null?'finish':'goto:'+nx}
  else if(k==='lift'){sub='Time under tension';btn='Done';act='done'}

  else if(k==='over'){sub='Rest is up. Start when ready';btn='Start set '+(j+1);act='start'}
  else{sub=ses.state==='lift'&&!mine?'Another exercise is mid-set':'';btn='Start set '+(j+1)}
  if(T.dataset.k!==k){const was=T.dataset.k;T.dataset.k=k;T.className='timer '+k;
    if(was&&was!==k&&T.animate){[$('#tL'),$('#tC')].forEach(el=>el.animate([{opacity:.25,transform:'scale(.96)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'}))}}
  tick.lastK=k;
  $('#tL').textContent=label;$('#tC').textContent=k==='done'?clock(ms):(p.over&&mine&&j>=0?'+':'')+seg(ms);$('#tS').textContent=sub;
  const B=$('#tB');if(B.textContent!==btn)B.textContent=btn;B.dataset.act=act;

}

  on('[data-wdel]',()=>{const w=wcur();confirmBox(`Delete ${esc(w.name)}?`,'Days that use it become rest days. Your history stays.','Delete',()=>{workouts=workouts.filter(x=>x!==w);week=week.map(x=>x===w.id?null:x);if(pdraft)pdraft=pdraft.map(n=>n===w.name?null:n);planW=null;save();syncToday();render()})});
  // stats
  on('[data-range]',b=>{range=+b.dataset.range;S.set('gym.range',range);render()});
  bindAnalytics(A);
  on('[data-sample]',()=>sampleData());
}
function syncToday(force){if(!ses)return;if(ses.date!==dkey(new Date())){ses=null;ensureSession();return}
  if(ses.startedAt)return;const p=plannedToday();
  const keep=!force&&ses.manual&&workouts.some(w=>w.id===ses.wid);
  ses=buildSession(keep?ses.wid:p,keep);save()}
function switchToPlan(){const p=plannedToday();const w=workouts.find(x=>x.id===p);const any=ses.ex.some(e=>doneCount(e)>0);
  const go=()=>{if(any){closeState();const sets=ses.ex.flatMap(e=>e.sets.filter(s=>s.done));
      hist.push({id:nid(),date:ses.date,start:ses.startedAt,split:ses.split,total:Date.now()-(ses.startedAt||Date.now()),tut:ses.tut,rest:ses.rest,sets:sets.length,volume:Math.round(sets.reduce((a,s)=>a+s.w*s.r,0)),unit:U(),
        ex:ses.ex.filter(e=>e.sets.some(s=>s.done)).map(e=>({name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({w:s.w,r:s.r,tut:s.tut,rest:s.rest||null}))}))})}
    ses=buildSession(p);focus=null;save();render()};
  confirmBox(`Switch to ${esc(w?w.name:'Rest')}?`,any?`The ${esc(ses.split)} sets you logged are saved.`:'',  'Switch',go)}
render();
</script>
