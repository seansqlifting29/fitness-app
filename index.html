:root{
  --bg:#fdf9f0; --card:#ffffff; --card2:#f3ede1; --line:#e9e1d2;
  --t1:#1c1a16; --t2:#4a443a; --t3:#776d5e;
  --lift:#199e70; --rest:#d95926; --other:#3987e5; --over:#e66767;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f3ecdd;font-family:Inter,system-ui,sans-serif;color:var(--t1);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){body{display:flex;align-items:center;justify-content:center;padding:24px}#app{height:min(860px,calc(100vh - 48px));width:390px;border-radius:32px;border:8px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #e9e1d2}}
.main{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;flex:none}
.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.hdr .sub{font-size:14px;color:var(--t3);margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--t2);fill:none;stroke-width:2}

/* ---------- calm list ---------- */
.home{flex:1;display:flex;flex-direction:column;padding:6px 20px 20px}
.livepill{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;margin:6px 0 4px;font-size:14px;color:var(--t2);width:100%;text-align:left}
.livepill .dot{width:9px;height:9px;border-radius:50%;background:var(--t3)}
.livepill.saved .dot{background:var(--lift)}
.livepill.lift .dot{background:var(--lift)}.livepill.rest .dot{background:var(--rest)}.livepill.over .dot{background:var(--over)}
.livepill b{color:var(--t1);margin-left:auto;font-weight:700}
.items{margin-top:14px}
.item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px 4px;border-bottom:1px solid var(--line)}
.item:first-child{border-top:1px solid var(--line)}
.circ{width:28px;height:28px;border-radius:50%;border:2px solid #b2a793;flex:none;display:grid;place-items:center;transition:all .15s}
.circ svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0}
.item.done .circ{background:var(--lift);border-color:var(--lift)}
.item.done .circ svg{opacity:1}
.item .t{flex:1;font-size:19px;font-weight:600;letter-spacing:-.2px}
.item.done .t{color:var(--t3);text-decoration:line-through;text-decoration-thickness:1.5px}
.item .p{font-size:13px;color:var(--t3);font-weight:600}
.item.going .p{color:var(--t2)}
.chev{width:18px;height:18px;stroke:#b2a793;fill:none;stroke-width:2.4;flex:none}
.addrow{color:var(--t3);font-size:15px;padding:18px 4px;text-align:left;width:100%}
.spacer{flex:1}
.finish{width:100%;height:56px;border-radius:16px;background:var(--card2);font-weight:700;font-size:17px;color:var(--t2);margin-top:16px}
.finish.ready{background:var(--t1);color:#ffffff}
.restday{text-align:center;padding:60px 10px 10px}
.restday h2{font-size:24px;margin-bottom:8px}
.restday p{color:var(--t3);font-size:15px;margin-bottom:20px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card2);border-radius:20px;padding:10px 15px;font-weight:600;font-size:14px}

/* ---------- focus view ---------- */
.focus{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:8}
.focus.enter{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.ftop{flex:1;display:flex;flex-direction:column;padding:14px 20px 16px;min-height:0;overflow-y:auto;scrollbar-width:none}
.ftop::-webkit-scrollbar{display:none}
.fbar{display:flex;align-items:center;justify-content:space-between}
.back{display:flex;align-items:center;gap:2px;color:var(--t2);font-weight:600;font-size:15px;padding:6px 0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4}
.fname{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-top:10px}
.fset{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--t3);font-size:15px;font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#dbd1bf}
.dots i.d{background:var(--lift)}.dots i.c{background:var(--t1)}
.inputs{display:flex;gap:10px;margin-top:auto}
.stepper{flex:1;background:var(--card);border-radius:20px;padding:12px 10px 10px;text-align:center}
.stepper label{font-size:12px;color:var(--t3);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.stepper input{display:block;width:100%;background:none;border:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1.5px;outline:none;margin:2px 0 6px;padding:0}
.stepper .pm{display:flex;gap:8px}
.stepper .pm button{flex:1;height:44px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:600;color:var(--t2)}
.stepper .pm button:active{background:#dbd1bf}
.inputs .stepper{transition:opacity .3s ease}
.inputs.off .stepper{opacity:.35}
.itag.live{color:#b4461b}
.focus.shortT .timer{height:auto;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.focus.shortT .tclock{font-size:min(14vw,58px);margin:8px 0 0}
.focus.shortT .tsub{margin-top:6px}
.focus.shortT .tbtn{margin-top:14px;height:54px}
.focus.shortT .itag{margin-top:8px}
.picks{min-height:100px}
.itag{margin-top:auto;min-height:18px;font-size:12.5px;font-weight:600;color:var(--t3);text-align:center;margin-bottom:6px}
.itag b{color:var(--t2)}
.itag+.inputs{margin-top:0}
.inputs.compact{margin-top:10px}
.inputs.compact .stepper{padding:7px 8px 8px}
.inputs.compact .stepper input{font-size:30px;margin:0 0 4px}
.inputs.compact .stepper .pm button{height:34px;font-size:20px}
.inputs.compact+.fnote{margin-top:6px}
.pick{padding:11px 14px}
.inputs.live .stepper{box-shadow:inset 0 0 0 1.5px #b4461b}
.inputs.off .stepper button{cursor:default}
.logwrap{margin-top:auto}
.loghead{font-size:12.5px;font-weight:700;color:#b4461b;letter-spacing:.8px;text-transform:uppercase;margin:0 2px 8px}
.logwrap .inputs{margin-top:0}
.inputs.ro .stepper{padding:14px 10px 16px;border:1px solid var(--line)}
.inputs.ro .stepper b{display:block;font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-top:4px}
.fixhint{font-size:12px;color:var(--t3);margin:6px 2px 0}
.fnote b{color:var(--t2);font-weight:700}
.fnote{font-size:13px;color:var(--t3);text-align:center;margin-top:10px;min-height:18px}
.fnote button{color:var(--t2);font-weight:600;text-decoration:underline;text-underline-offset:3px}

    ex:d.ex.map(e=>{const prev=lastFor(e.name);return{name:e.name,rest:e.rest,prev:prev?prev.sets.map(s=>num(s.w)+' × '+s.r).join(', '):'',
      sets:Array.from({length:e.sets},(_,i)=>{const p=prev&&prev.sets[i];return{w:p?p.w:e.w,r:p?p.r:e.reps,done:false,tut:0}})}})};

const plannedToday=()=>{const id=week[wd(new Date())];return workouts.some(w=>w.id===id)?id:null};

    ex:ses.ex.filter(e=>e.sets.some(x=>x.done)).map(e=>({name:e.name,sets:e.sets.filter(x=>x.done).map(x=>({w:x.w,r:x.r,tut:x.tut,rest:x.rest||null}))}))});

function planDrag(el,onDrop,onStart,onEnd){
  el.addEventListener('pointerdown',ev=>{
    if(ev.button>0)return;const sx=ev.clientX,sy=ev.clientY;let ghost=null,over=null,started=false;const r=el.getBoundingClientRect();

      if(!started){if(Math.hypot(x-sx,y-sy)<7)return;started=true;ghost=el.cloneNode(true);ghost.className+=' dghost';ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);onStart&&onStart();try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}}
      e.preventDefault();ghost.style.transform=`translate(${x-r.width/2}px,${y-r.height/2}px) scale(1.06)`;
      const t=document.elementFromPoint(x,y);const d=t&&t.closest('[data-drop]');if(d!==over){over&&over.classList.remove('dover');over=d;over&&over.classList.add('dover')}};
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      if(ghost)ghost.remove();over&&over.classList.remove('dover');
      if(started){el.addEventListener('click',kill,{capture:true,once:true});setTimeout(()=>el.removeEventListener('click',kill,{capture:true}),300);onDrop(over)}onEnd&&onEnd()};
    const kill=e=>{e.stopPropagation();e.preventDefault()};
    window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
}

function bindSched(A){
  const car=A.querySelector('#car');if(!car)return;
  const cards=[...car.querySelectorAll('.scard')];const days=[...A.querySelectorAll('[data-j]')];
  // where the scroller has to be for card i to sit in the middle
  const target=i=>{const c=cards[i];if(!c)return car.scrollLeft;const cr=car.getBoundingClientRect(),r=c.getBoundingClientRect();return car.scrollLeft+(r.left-cr.left)-(car.clientWidth-r.width)/2};
  const nearest=()=>{const cr=car.getBoundingClientRect();const mid=cr.left+cr.width/2;let best=0,bd=1e9;cards.forEach((c,i)=>{const r=c.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;best=i}});return best};
  const mark=i=>{if(mark.cur===i)return;mark.cur=i;days.forEach((b,k)=>b.classList.toggle('on',k===i))};
  let aim=null,aimT=null;
  const go=(i,smooth)=>{schedDay=i;mark(i);aim=i;clearTimeout(aimT);aimT=setTimeout(()=>{aim=null},smooth?900:50);
    car.scrollTo({left:target(i),behavior:smooth?'smooth':'auto'})};
  mark.cur=null;go(schedDay,false);
  days.forEach((b,k)=>b.onclick=()=>go(k,true));
  // follow the swipe live, one update per frame
  let raf=0;car.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const n=nearest();
    if(aim!==null){if(n===aim){clearTimeout(aimT);aimT=setTimeout(()=>{aim=null},120)}return}
    schedDay=n;mark(n)})},{passive:true});
  car.addEventListener('scrollend',()=>{aim=null;const n=nearest();schedDay=n;mark(n)});
}

const nice=(lo,hi,n=3)=>{const span=hi-lo||1;const st=Math.pow(10,Math.floor(Math.log10(span/n)));const m=[1,2,2.5,5,10].find(k=>span/(k*st)<=n+1)*st;const a=Math.floor(lo/m)*m,b=Math.ceil(hi/m)*m;const t=[];for(let v=a;v<=b+1e-9;v+=m)t.push(+v.toFixed(6));return t};

function phase(){
  // what the timer should show right now, from the user's point of view
  const now=Date.now();
  if(ses.state==='lift')return{k:'lift',label:'Lifting',ms:now-ses.stateAt};
  if(ses.state==='rest'){const left=ses.restTarget-(now-ses.stateAt);
    if(left>=0)return{k:'rest',label:'Rest',ms:left};return{k:'over',label:'Rest over',ms:-left,over:true}}
  if(ses.state==='next')return{k:'next',label:'Next station',ms:now-ses.stateAt};
  return{k:'idle',label:'Ready',ms:0};
}
function tick(){try{tickInner()}catch(e){console.error(e)}}
function tickInner(){
  if(!ses)return;
  if(!document.querySelector('.scrim')&&focus===null&&!document.querySelector('.dghost')){
    const newDay=ses.date!==dkey(new Date());const open=ses.startedAt&&!ses.finished;const idle=Date.now()-ses.stateAt;
    const stale=open?(idle>IDLE_LIMIT||(newDay&&idle>3600000)):newDay;
    if(stale&&!tick.rolling){tick.rolling=true;try{render()}finally{tick.rolling=false}return}}
  if(tab!=='today')return;
  if(ses.active!==null&&!ses.ex[ses.active]){ses.active=null;ses.state='idle'}
  const p=phase();
  if(p.over&&!ses.beeped){ses.beeped=true;save();beep()}
  const total=ses.startedAt?(ses.endedAt||Date.now())-ses.startedAt:0;
  const pill=$('#pill');
  if(pill){pill.className='livepill '+(p.k==='next'?'':p.k);
    const a=ses.active!==null?ses.ex[ses.active]:null;
    $('#pillT').textContent=p.k==='lift'?`Lifting · ${a.name}`:p.k==='rest'?`Resting ${clock(p.ms)} · ${a.name}`:p.k==='over'?`Rest over · ${a.name}`:'Gym time';
    $('#pillC').textContent=clock(total)}
  const T=$('#ftimer');if(!T)return;
  const i=focus;const e=ses.ex[i];const mine=ses.active===i;
  let k=mine?p.k:'idle',label=mine?p.label:'Ready',ms=mine?p.ms:0,sub='',btn='Start set',act='start';
  const j=curIdx(e);
  if(ses.finished){k='done';label='Workout saved · gym time';ms=total;sub='';btn='Back to today';act='close'}
  else if(j<0){const nx=chosenNext(i);k=nx===null?'done':'next';label=nx===null?'Workout complete · gym time':'Next station';ms=nx===null?total:(mine&&ses.state==='next'?p.ms:0);
    sub=nx===null?'Every exercise is checked off':'Time since your last set';btn=nx===null?'Finish workout':'Next: '+ses.ex[nx].name;act=nx===null?'finish':'goto:'+nx}
  else if(k==='lift'){sub='Time under tension';btn='Done';act='done'}
  else if(k==='rest'){sub='Set '+(j+1)+' next';btn='Start set '+(j+1);act='start'}
  else if(k==='over'){sub='Rest is up. Start when ready';btn='Start set '+(j+1);act='start'}
  else{sub=ses.state==='lift'&&!mine?'Another exercise is mid-set':'';btn='Start set '+(j+1)}
  if(T.dataset.k!==k){const was=T.dataset.k;T.dataset.k=k;T.className='timer '+k;
    if(was&&was!==k&&T.animate){[$('#tL'),$('#tC')].forEach(el=>el.animate([{opacity:.25,transform:'scale(.96)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'}))}}
  tick.lastK=k;
  $('#tL').textContent=label;$('#tC').textContent=k==='done'?clock(ms):(p.over&&mine&&j>=0?'+':'')+seg(ms);$('#tS').textContent=sub;
  const B=$('#tB');if(B.textContent!==btn)B.textContent=btn;B.dataset.act=act;
  $('#mT').textContent=clock(total);$('#mU').textContent=clock(liveTut());$('#mR').textContent=clock(liveRest());
}

  s.querySelector('[data-bload]').onchange=e=>{const f=e.target.files[0];if(f){s.remove();backupLoad(f)}};
  s.querySelector('#sn').onchange=e=>{me.name=e.target.value.trim()||me.name;save()};
  s.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{cfg.unit=b.dataset.u;save();s.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('on',x===b));render();$('#app').appendChild(s)});
  s.querySelector('#ss').onchange=e=>{cfg.sound=e.target.checked;save()};
  const rdesc=()=>{s.querySelector('#rdesc').textContent=cfg.restMode==='ratio'?`A 30s set gets ${clock(Math.min(360000,Math.max(30000,30000*cfg.ratio)))} rest. Kept between 0:30 and 6:00.`:'Each exercise uses the rest time set in Plan.';s.querySelector('#rv').textContent='1:'+cfg.ratio;s.querySelector('#rrow').style.display=cfg.restMode==='ratio'?'':'none'};
  rdesc();
  s.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cfg.restMode=b.dataset.rm;save();s.querySelectorAll('[data-rm]').forEach(x=>x.classList.toggle('on',x===b));rdesc()});
  s.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{cfg.ratio=Math.min(10,Math.max(1,cfg.ratio+ +b.dataset.rr));save();rdesc()});
  s.querySelector('[data-wipe]').onclick=()=>{s.remove();confirmBox('Erase everything?','Your plan, history and current workout will be deleted from this device.','Erase',()=>{['gym.me','gym.plan','gym.workouts','gym.week','gym.blocks','gym.hist','gym3.session','gym.cfg','fit.user'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});me=null;{const m=fromDays(starterPlan());workouts=m.ws;week=m.wk}hist=[];blocks=[];ses=null;render()})};
}
function addExerciseSheet(onAdd){
  const s=sheet(`<h3>Add exercise</h3><input class="field" id="an" placeholder="Exercise name" style="margin-top:10px">
    <div class="edit" style="padding:0;background:none;border:0"><div class="grid"><label>Sets<input id="as" inputmode="numeric" value="3"></label><label>Reps<input id="ar" inputmode="numeric" value="10"></label><label>${U()}<input id="aw" inputmode="decimal" value="20"></label><label>Rest s<input id="at" inputmode="numeric" value="60"></label></div></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-close>Cancel</button><button class="btn w" data-add>Add</button></div>`);
  setTimeout(()=>s.querySelector('#an').focus(),60);
  s.querySelector('[data-add]').onclick=()=>{const n=s.querySelector('#an').value.trim();if(!n)return s.querySelector('#an').focus();
    onAdd(E(n,Math.max(1,parseInt(s.querySelector('#as').value)||1),Math.max(1,parseInt(s.querySelector('#ar').value)||1),Math.max(0,parseFloat(s.querySelector('#aw').value)||0),Math.max(0,parseInt(s.querySelector('#at').value)||0)));s.remove();render()};
}
function sampleData(){
  const names=[0,1,2,4,5];let d=new Date();d.setHours(0,0,0,0);const out=[];
  for(let k=60;k>=1;k--){const day=new Date(d);day.setDate(d.getDate()-k);const w=wd(day);const p=dayW(w);if(!p||!p.ex.length||Math.random()<.2)continue;
   let tut=0,rest=0,sets=0,vol=0;const ex=p.ex.map(e=>{const ss=Array.from({length:e.sets},(_,i)=>{const t=(25+Math.random()*25)*1000;tut+=t;sets++;const ww=Math.max(0,Math.round(e.w*(.8+.2*(60-k)/60)/2.5)*2.5);const rr=Math.max(1,e.reps-(Math.random()<.3?1:0)-(i===e.sets-1&&Math.random()<.4?1:0));vol+=ww*rr;return{w:ww,r:rr,tut:t}});rest+=(e.sets-1)*e.rest*1000*(0.9+Math.random()*.6);return{name:e.name,sets:ss}});
    rest+=(p.ex.length-1)*60000*(.5+Math.random());const total=tut+rest+(6+Math.random()*10)*60000;
    out.push({id:nid(),date:dkey(day),start:day.getTime()+(6+Math.floor(Math.random()*13))*36e5+Math.floor(Math.random()*60)*6e4,split:p.name,total,tut,rest,sets,volume:Math.round(vol),unit:U(),ex})}
  hist=out.concat(hist);save();render();
}


/* ===== backup: one file with everything, works on any device ===== */
const BKEYS=['gym.me','gym.workouts','gym.week','gym.hist','gym.blocks','gym.cfg','gym.split','gym.range','gym3.session'];
function backupSave(){
  const data={};BKEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)data[k]=JSON.parse(v)}catch(e){}});
  const txt=JSON.stringify({app:'fitness',version:1,saved:new Date().toISOString(),data});
  const name='fitness-backup-'+dkey(new Date())+'.json';
  try{const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){}
  if(window.top!==window){try{navigator.clipboard.writeText(txt).then(()=>sheet('<h3>Backup copied</h3><p>Saving files is blocked inside Claude, so the backup was copied instead. Paste it into a note to keep it.</p><button class="btn w" style="width:100%" data-close>OK</button>',true))}catch(e){}}
}
function backupLoad(file){
  const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(e){j=null}
    if(!j||j.app!=='fitness'||!j.data)return sheet('<h3>That file isn\'t a backup</h3><p>Pick a file saved with Save backup.</p><button class="btn w" style="width:100%" data-close>OK</button>',true);
    const n=(j.data['gym.hist']||[]).length;
    confirmBox('Restore this backup?',`It has ${n} workout${n===1?'':'s'} from ${j.saved?new Date(j.saved).toLocaleDateString():'an earlier date'}. Everything on this device will be replaced.`,'Restore',()=>{
      BKEYS.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});Object.entries(j.data).forEach(([k,v])=>{if(BKEYS.includes(k))try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}});
      try{localStorage.setItem('gym.weekReset1','true')}catch(e){}location.reload()})};
  r.readAsText(file);
}


/* ===== events ===== */
function bind(){
  const A=$('#app');const on=(sel,fn)=>A.querySelectorAll(sel).forEach(el=>el.onclick=ev=>{const key=el.outerHTML.slice(0,120);const n=Date.now();if(sel!=='[data-adj]'&&bind.lastKey===key&&n-bind.lastAt<300)return;bind.lastKey=key;bind.lastAt=n;fn(el,ev)});
  on('[data-tab]',b=>{const go=()=>{tab=b.dataset.tab;planW=null;planMode='sched';schedDay=null;focus=null;focusMenu=false;render();const m=$('#main');if(m)m.scrollTop=0};if(tab==='plan')guardLeave(go);else go()});
  on('[data-settings]',()=>settingsSheet());
  // list
  on('[data-open]',b=>{focus=+b.dataset.open;nextPick=null;render()});
  on('[data-tog]',b=>{if(!ses.finished)toggleExercise(+b.dataset.tog)});
  on('[data-another]',()=>{const s2=sheet(`<h3>Start another workout</h3><p>Today's workout is already saved.</p><div class="chips" style="justify-content:flex-start">${workouts.filter(w=>w.ex.length).map(w=>`<button class="chip" data-swap2="${w.id}">${esc(w.name)}</button>`).join('')}</div>`);
    s2.querySelectorAll('[data-swap2]').forEach(x=>x.onclick=()=>{ses=buildSession(x.dataset.swap2,true);save();s2.remove();render()})});
  on('[data-resume]',()=>{focus=ses.active!==null?ses.active:0;render()});
  on('[data-toplan]',()=>switchToPlan());
  on('[data-goplan]',()=>{tab='plan';planW=null;planMode='edit';render()});
  on('[data-swap]',b=>{ses=buildSession(b.dataset.swap,true);save();render()});
  on('[data-addex]',()=>pickForToday());
  on('[data-finish]',()=>{const all=ses.ex.every(exDone);if(all)return finishWorkout();
    confirmBox('Finish early?','Whatever you checked off gets saved. The rest is skipped.','Finish',finishWorkout,'Keep going')});
  // focus
  on('[data-close-focus]',()=>{if(focus!==null)readInputs(focus),save();focus=null;render()});
  on('[data-adj]',b=>{const [k,v]=b.dataset.adj.split(':');const inp=k==='w'?$('#inW'):$('#inR');inp.value=num(Math.max(0,(parseFloat(inp.value)||0)+ +v));readInputs(focus);save()});
  A.querySelectorAll('#inW,#inR').forEach(inp=>{inp.onfocus=()=>inp.select();inp.onchange=()=>{readInputs(focus);save()}});
  on('[data-undo]',()=>undoLast());
  on('[data-fix]',b=>editSet(focus,+b.dataset.fix));
  on('[data-tgt]',b=>editSet(focus,+b.dataset.tgt));
  on('[data-xset]',()=>{const e=ses.ex[focus];const l=e.sets[e.sets.length-1]||{w:0,r:10};e.sets.push({w:l.w,r:l.r,done:false,tut:0});
    if(ses.active===focus&&ses.state==='next'){closeState();ses.state='rest';ses.restTarget=30000;ses.restBy=null;ses.stateAt=Date.now()}save();render()});
  on('[data-pick]',b=>{readInputs(focus);save();nextPick=+b.dataset.pick;render()});
  on('[data-nexto]',()=>{focusUI.nextOpen=true;render()});
  on('[data-dmore]',()=>{focusUI.more=!focusUI.more;render()});
  on('[data-tb]',b=>{const a=b.dataset.act||'start';
    if(a==='start'){readInputs(focus);
      if(ses.state==='lift'&&ses.active!==focus)return confirmBox('Switch exercise?',`You're mid-set on ${esc(ses.ex[ses.active].name)}. That set will be dropped.`,'Switch',()=>startSet(focus));
      startSet(focus)}
    else if(a==='done')finishSet(focus);
    else if(a==='finish'){readInputs(focus);finishWorkout()}
    else if(a==='close'){focus=null;render()}
    else if(a.startsWith('goto:')){readInputs(focus);save();focus=+a.split(':')[1];nextPick=null;render()}});
  // plan
  on('[data-wday]',b=>dayPicker(+b.dataset.wday));
  if(tab==='plan'&&planW===null){if(planMode==='edit')bindPlanEditor(A);else bindSched(A)}
  on('[data-schedset]',()=>schedSettings());
  on('[data-sgo]',()=>{tab='today';render()});
  on('[data-sopen]',b=>openWorkoutByName(b.dataset.sopen));
  on('[data-splan],[data-toplanedit]',()=>{planMode='edit';render()});
  on('[data-wopen]',b=>{const n=b.dataset.wopen;guardLeave(()=>{let w=workouts.find(x=>x.id===n||x.name===n);
    if(!w){const ex=(TEMPLATE_EX[n]||[]).map(x=>LIBMAP[x.toLowerCase()]).filter(Boolean).map(x=>E(x.name,x.sets,x.reps,U()==='lb'?Math.round(x.w*2.2/5)*5:x.w,x.rest));w={id:nid(),name:n,ex};workouts.push(w);save()}
    planW=w.id;planOpen=undefined;render();$('#main').scrollTop=0})});
  on('[data-wnew]',()=>guardLeave(()=>{const w={id:nid(),name:'New workout',ex:[]};workouts.push(w);planW=w.id;save();render();const n=$('[data-wname]');if(n){n.focus();n.select()}}));
  on('[data-backplan]',()=>{planW=null;syncToday();render()});
  const wcur=()=>workouts.find(x=>x.id===planW)||{name:'',ex:[]};
  const wn=A.querySelector('[data-wname]');if(wn)wn.onchange=()=>{const w=wcur();const old=w.name;let nm=wn.value.trim()||'Workout';if(nm!==old&&workouts.some(x=>x!==w&&x.name===nm))nm+=' 2';w.name=nm;wn.value=nm;if(pdraft)pdraft=pdraft.map(n=>n===old?nm:n);save()};
  on('[data-popen]',b=>{planOpen=b.dataset.popen||null;render()});
  on('[data-pe]',b=>{const [k,i]=b.dataset.pe.split(':');editField(wcur(),+i,k)});
  on('[data-up]',b=>{const i=+b.dataset.up;if(i<1)return;const a=wcur().ex;[a[i-1],a[i]]=[a[i],a[i-1]];save();render()});
  on('[data-del]',b=>{wcur().ex.splice(+b.dataset.del,1);save();render()});
  on('[data-padd]',()=>pickForWorkout(wcur()));
  on('[data-wdel]',()=>{const w=wcur();confirmBox(`Delete ${esc(w.name)}?`,'Days that use it become rest days. Your history stays.','Delete',()=>{workouts=workouts.filter(x=>x!==w);week=week.map(x=>x===w.id?null:x);if(pdraft)pdraft=pdraft.map(n=>n===w.name?null:n);planW=null;save();syncToday();render()})});
  // stats
  on('[data-range]',b=>{range=+b.dataset.range;S.set('gym.range',range);render()});
  bindAnalytics(A);
  on('[data-sample]',()=>sampleData());
}
function syncToday(force){if(!ses)return;if(ses.date!==dkey(new Date())){ses=null;ensureSession();return}
  if(ses.startedAt)return;const p=plannedToday();
  const keep=!force&&ses.manual&&workouts.some(w=>w.id===ses.wid);
  ses=buildSession(keep?ses.wid:p,keep);save()}
function switchToPlan(){const p=plannedToday();const w=workouts.find(x=>x.id===p);const any=ses.ex.some(e=>doneCount(e)>0);
  const go=()=>{if(any){closeState();const sets=ses.ex.flatMap(e=>e.sets.filter(s=>s.done));
      hist.push({id:nid(),date:ses.date,start:ses.startedAt,split:ses.split,total:Date.now()-(ses.startedAt||Date.now()),tut:ses.tut,rest:ses.rest,sets:sets.length,volume:Math.round(sets.reduce((a,s)=>a+s.w*s.r,0)),unit:U(),
        ex:ses.ex.filter(e=>e.sets.some(s=>s.done)).map(e=>({name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({w:s.w,r:s.r,tut:s.tut,rest:s.rest||null}))}))})}
    ses=buildSession(p);focus=null;save();render()};
  confirmBox(`Switch to ${esc(w?w.name:'Rest')}?`,any?`The ${esc(ses.split)} sets you logged are saved.`:'',  'Switch',go)}
render();
</script>
